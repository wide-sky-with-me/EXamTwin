# Docker Desktop/WSL: keep the application loopback-only inside its network
# namespace and publish only the local proxy on the host loopback address.
x-local-network: &local-network
  network_mode: !reset null
  networks: [default]

x-local-environment: &local-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-examtwin}:${POSTGRES_PASSWORD:-examtwin_dev}@postgres:5432/${POSTGRES_DB:-examtwin}
  QDRANT_URL: http://qdrant:6333
  OBJECT_STORE_ENDPOINT_URL: http://seaweedfs:8333
  # The host shell's loopback proxy is unreachable from the bridge network.
  HTTP_PROXY: ${CONTAINER_PROXY_URL:-}
  HTTPS_PROXY: ${CONTAINER_PROXY_URL:-}
  ALL_PROXY: ""
  NO_PROXY: localhost,127.0.0.1,postgres,qdrant,seaweedfs

services:
  api:
    <<: *local-network
    environment:
      <<: *local-environment
      API_BIND_HOST: 127.0.0.1
      LOCAL_ACCESS_ONLY: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:18001"

  paper-worker:
    <<: *local-network
    environment: *local-environment

  storage-gc:
    <<: *local-network
    environment: *local-environment

  local-proxy:
    image: nginx:1.28-alpine
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8000}
      NGINX_ENVSUBST_FILTER: API_PORT
    volumes:
      - ./scripts/local-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18001/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
