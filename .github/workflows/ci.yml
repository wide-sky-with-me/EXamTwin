name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check backend
      - run: uv run basedpyright
      - run: uv run python scripts/export_openapi.py --check frontend/openapi.json
      - run: uv run pytest -m "not integration" -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:types:check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  integration:
    name: PostgreSQL, Qdrant and S3 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: examtwin
          POSTGRES_PASSWORD: examtwin_test
          POSTGRES_USER: examtwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examtwin -d examtwin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
          - 6334:6334
    env:
      DATABASE_URL: postgresql://examtwin:examtwin_test@127.0.0.1:5432/examtwin
      EXAMTWIN_TEST_DATABASE_URL: postgresql://examtwin:examtwin_test@127.0.0.1:5432/examtwin
      EXAMTWIN_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      EXAMTWIN_TEST_S3_SECRET_KEY: examtwin_test_secret
      OBJECT_STORE_LOCAL_ROOT: ${{ runner.temp }}/examtwin-var
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"
          version: "0.11.12"
      - name: Start S3-compatible object storage
        run: >-
          docker run --detach --name examtwin-seaweedfs
          --env AWS_ACCESS_KEY_ID=examtwin
          --env AWS_SECRET_ACCESS_KEY=examtwin_test_secret
          --publish 8333:8333 --publish 9333:9333
          chrislusf/seaweedfs:4.27 mini -dir=/data
      - name: Wait for infrastructure
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:9333/cluster/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs examtwin-seaweedfs
          exit 1
      - run: uv sync --frozen --group dev
      - run: uv run pytest -m integration -q
