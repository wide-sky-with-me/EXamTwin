[project]
name = "examtwin"
version = "0.1.0"
description = "Multi-subject evidence-grounded RAG, paper answering, and marking workbench"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-openai>=0.6,<0.7",
  "llama-index-llms-openai-like>=0.6,<0.7",
  "llama-index-readers-mineru>=0.1.1,<0.2",
  "llama-index-tools-mcp>=0.4,<0.5",
  "llama-index-vector-stores-qdrant>=0.10.2,<0.11",
  "litellm>=1.103,<2",
  "numpy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "qdrant-client>=1.16,<1.17",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "sympy>=1.14,<2",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "pymupdf>=1.26,<2",
]

[project.scripts]
examtwin = "examtwin.app.cli:app"
examtwin-healthcheck = "examtwin.app.healthcheck:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "httpx2>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/examtwin"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires the project Docker infrastructure",
  "local_assets: requires purchased or generated corpus files excluded from Git",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".codegraph", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.basedpyright]
include = ["backend/src/examtwin"]
exclude = ["backend/migrations"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "warning"
